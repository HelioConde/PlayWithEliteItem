name: Build and test mod
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore game plugin dependencies
        run: dotnet restore GiveEliteItem.sln
      - name: Build game plugin
        run: dotnet build GiveEliteItem.sln --configuration Release --no-restore
      - name: Run deterministic distribution tests
        run: dotnet run --project tests/PlayWithEliteItem.LogicTests/PlayWithEliteItem.LogicTests.csproj --configuration Release
      - name: Save compiled plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PlayWithEliteItem
          path: GiveEliteItem/bin/Release/netstandard2.1/GiveEliteItem.dll
