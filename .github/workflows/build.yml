name: Build mod
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore GiveEliteItem.sln
      - name: Compile
        run: dotnet build GiveEliteItem.sln --configuration Release --no-restore
      - name: Save plugin artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PlayWithEliteItem
          path: GiveEliteItem/bin/Release/netstandard2.1/GiveEliteItem.dll
